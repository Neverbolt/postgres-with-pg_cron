name: Publish PostgreSQL 14 with pg_cron and VectorChord

on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-pg14
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check upstream image
        id: check
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          docker pull --platform linux/amd64 docker.io/library/postgres:14
          base_digest="$(docker image inspect docker.io/library/postgres:14 --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          previous_digest=""
          if docker pull --platform linux/amd64 "$IMAGE:14"; then
            previous_digest="$(docker image inspect "$IMAGE:14" --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}')"
          fi
          if [[ "$EVENT_NAME" != schedule || "$base_digest" != "$previous_digest" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 'true'
      - name: Smoke test both extensions
        if: steps.check.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker build --pull --build-arg "BASE_DIGEST=${{ steps.check.outputs.base_digest }}" -t pg14-extensions:smoke .
          docker run --detach --name pg14-extensions-smoke -e POSTGRES_PASSWORD=smoke pg14-extensions:smoke
          trap 'docker logs pg14-extensions-smoke || true; docker rm -f pg14-extensions-smoke || true' EXIT
          for attempt in {1..30}; do
            if docker exec pg14-extensions-smoke pg_isready -U postgres; then
              break
            fi
            sleep 2
          done
          docker exec pg14-extensions-smoke psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE EXTENSION pg_cron;" \
            -c "CREATE EXTENSION vchord CASCADE;" \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname IN ('pg_cron', 'vector', 'vchord') ORDER BY extname;"
          vector_version="$(docker exec pg14-extensions-smoke psql -At -U postgres -d postgres -c "SELECT extversion FROM pg_extension WHERE extname = 'vector'")"
          [[ "$vector_version" =~ ^0\.(7|8)\. ]] || { echo "Unsupported pgvector version: $vector_version"; exit 1; }
      - name: Build and publish
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.check.outputs.image }}:14
          build-args: |
            BASE_DIGEST=${{ steps.check.outputs.base_digest }}
